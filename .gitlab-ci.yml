image: cypress/browsers:node-22.14.0-chrome-135.0.7049.84-1-ff-137.0.2-edge-135.0.3179.54-1

stages:
  - test

cache:
  paths:
    - node_modules/
    - /root/.cache/Cypress/

cypress_tests:
  stage: test
  script:
    - npm ci
    - npm run typecheck
    - npm test
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - cypress/screenshots/
      - cypress/videos/
